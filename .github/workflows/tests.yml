name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Check beacon syntax
        run: |
          php -r '
          require "vendor/autoload.php";
          $compiler = new Illuminate\View\Compilers\BladeCompiler(new Illuminate\Filesystem\Filesystem(), sys_get_temp_dir());
          $template = file_get_contents("resources/views/components/beacon.blade.php");
          $config = ["max_events_per_page" => 5, "capture_resource_errors" => true, "capture_preload_errors" => true];
          $endpoint = "/js-error-logger";
          $nonce = null;
          ob_start();
          eval("?>" . $compiler->compileString($template));
          $html = ob_get_clean();
          preg_match("~<script[^>]*>(.*?)</script>~s", $html, $matches);
          file_put_contents("/tmp/beacon.js", $matches[1]);
          '
          node --check /tmp/beacon.js
          if grep -nE '=>|\bconst\b|\blet\b' /tmp/beacon.js; then
            echo "The beacon contains non-ES5 syntax."
            exit 1
          fi
